<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track page</title>
  <link rel='stylesheet' href='./styles/track.css'>
</head>

<body>
  <div id='header'>
    <div id='amazon-img'>
    <a href="amazon.html"><img src='./logos/collabed-logo.png'></a></div>
    <p id='heading'> Track page </p>
    <p id="help">help</p>
  </div>
  
  <section class="orderedProducts">
    <div class="box">
      <div class="imgBox">
        <img src="./images/products/backpack.jpg" />
      </div>
      <div class="productDetails">
        <div class="productName">
          <p class="name">name</p>
          <p class="price">price</p>
        </div>
        <div class="productDeliveryTime">
          <p class="deliveryText">deliver in 2 days</p>
        </div>
      </div>
    </div>
  </section>
  <div class="overlay">
    <img src="./assests/shopping-cart.gif"/>
    <p>order placed</p>
  </div>
  <script src='./scripts/track.js' type="module"></script>
</body>

</html>
