<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/checkout.css">
    <link rel="stylesheet" href="styles/checkout-cart.css">
</head>
<body>
    <div id="header">
        <a href='amazon.html'><img id="amazon-img" src="images/amazon-logo.png" alt="amazon img"></a>
        <p>Checkout &nbsp;(<span id="cart-length" style="color: rgb(106, 112, 194);">0 items</span>)</p>
        <img id="lock-img" src="images/icons/checkout-lock-icon.png" alt="lock icon">
    </div>

    <section id="center">
        <div id="left-section">

            <!-- product body -->
            <h3 id="review">Review your Order</h3>
            <br>
            <div class="left-section-center">
                <!-- added products will appear here -->
            </div>

        </div>
        <div id="right-section">
            <div id="cash-box">
                <p id="p1">Order Summary</p><br>

                <p class="p2">Items (0) :</p>  
                <p class="items">&#8377; 0</p><br>

                <p class="p2">Shipping & Handling :</p>
                <p class="shipping">&#8377; 0</p><br>

                <br>

                <p class="p2">Total before Tax :</p>  
                <p class="subtotal">&#8377; 0</p><br>

                <p class="p2">Estimated Tax (10%) :</p>
                <p class="tax">&#8377; 0</p><br>

                <br><br>
                <p id="p3">Order Total :</p>
                <p id="total">&#8377; 0</p> 
                <br>
                <br>
                <input type="radio" name="payment" class="payment"><p class="p4">Online Pay </p> <br>
                <input type="radio" name="payment" class="payment"><p class="p4">Cash on delivery </p> 

                <br>
                <br>
                <center>
                <a href="orderplaced.html"><button class="place-order">Place your order</button></a>
                </center>

            </div>
        </div>
    </section>
    <script type="module" src="./scripts/checkout.js"></script>
</script>
</body>
</html>
